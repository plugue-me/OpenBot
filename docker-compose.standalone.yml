name: openbot-independent
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: openbot_independent
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generated by start:standalone}
    ports:
      - "127.0.0.1:${STANDALONE_DB_PORT:-5544}:5432"
    volumes:
      - independent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot_independent"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  independent-postgres:
